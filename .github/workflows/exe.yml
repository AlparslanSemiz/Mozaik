# Task 4i: build the Windows .exe.
#
# This machine is Fedora and the target is Windows 10. Cross-compiling Tauri
# from Linux to Windows needs an MSVC toolchain that is not reliably
# reproducible, so the exe is born on `windows-latest` and comes back as an
# artifact. That is the whole reason this file exists: it is the only Windows
# machine this project has.
#
# WHAT IT PRODUCES IS ONE FILE, NOT AN INSTALLER. `--no-bundle` is deliberate
# and it is principle 1: "İndir, çift tıkla, çalışsın." Tauri's NSIS target
# would produce a setup wizard, which is exactly the thing this project has
# refused from the first day. The delivery is `Ders Programı.exe`.
#
# It needs WebView2 on the target machine. Windows 10 and 11 ship it, and my
# father's machine already has it (151.0.4129.101, measured). A machine
# without it shows a dialog with a download link rather than failing silently.
#
# Manual only. The site workflow runs on every push because a page that is
# out of date is wrong; an exe that is out of date is just an older copy of a
# tool that works, and building one takes minutes of a Windows runner.

name: exe

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Rust builds from scratch take about ten minutes; cached, about one.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # The web build IS the app. `tauri.conf.json` runs this too through
      # `beforeBuildCommand`, but doing it here first means a TypeScript error
      # fails in thirty seconds instead of after the Rust link step.
      - run: npm run build

      # The only rule that lives in Rust rather than in TypeScript is
      # `safe_name` — the gate that keeps the exe writing into exactly one
      # folder. `cargo test` is the only place it can be judged.
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - run: npx --yes @tauri-apps/cli@^2 build --no-bundle

      # Renamed here rather than through `mainBinaryName`: the Cargo crate is
      # `ders-programi` (ASCII, as every identifier in this project is) and
      # the thing on my father's desktop is Turkish, as every piece of text he
      # reads is. One rename in the open beats a config key that does it out
      # of sight.
      - name: adını ver ve boyutunu ÖLÇ
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/ders-programi.exe"
          if (-not (Test-Path $exe)) {
            Get-ChildItem src-tauri/target/release -Filter *.exe
            throw "exe üretilmedi"
          }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "Ders Programı.exe  $mb MB"
          Copy-Item $exe "src-tauri/target/release/Ders Programı.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: Ders-Programi-exe
          path: src-tauri/target/release/Ders Programı.exe
          if-no-files-found: error
