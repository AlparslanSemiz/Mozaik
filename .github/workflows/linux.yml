# Linux'ta Mozaik AppImage'ı (DECISIONS 2026-11-16, "Linux sürümü"): yayından
# önce. surum.yml'in linux işinin hafif ikizi: aynı OR-Tools adımı, Rust
# testleri CP-SAT'ın küçük modeliyle, aynı `tauri build`, paketin içine
# bakılması (scripts/linux-paket.sh), ve programın birkaç dağıtımda gerçekten
# açılıp ayakta kaldığı (scripts/linux-acilis.sh).
#
# mac.yml gibi YAVAŞ SÜİT: birleştirmeyi beklemez (CLAUDE.md). Linux'a dokunan
# bir PR'da ve main push'unda kendiliğinden, ve elle.
#
# Önbellek yok ve kurulum betikleri koşmaz, surum.yml'deki gibi: bu iş aynı
# paketi üretir, ve yayındakinden başka bir yoldan üretmesi ölçtüğü şeyi
# değiştirirdi.
name: linux

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/ortools-linux.sh'
      - 'scripts/linux-paket.sh'
      - 'scripts/linux-acilis.sh'
      - '.github/workflows/linux.yml'
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/ortools-linux.sh'
      - 'scripts/linux-paket.sh'
      - 'scripts/linux-acilis.sh'
      - '.github/workflows/linux.yml'

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    # 22.04 BİLEREK, öbür Linux işlerinin 24.04'ü değil: program derlendiği
    # sistemin glibc'sini ister, ve 22.04'ünki (2.35) Ubuntu 22.04/24.04,
    # Debian 12 ve Fedora'da var (BUILD.md, "Linux").
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable dalı, 2026-11-15
        with:
          toolchain: stable

      # Tauri'nin Linux'ta istedikleri (WebKitGTK 4.1 ve GTK), AppImage
      # paketleyicisinin `file`'ı, paketin içine bakan `readelf` (binutils).
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev patchelf file binutils >/dev/null

      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: OR-Tools CP-SAT for the AppImage
        run: scripts/ortools-linux.sh

      # `the_library_answers_a_tiny_model` yalnız MOZAIK_ORTOOLS varken koşar.
      - name: cargo test, with the CP-SAT tiny model
        run: |
          MOZAIK_ORTOOLS="$PWD/src-tauri/ortools/libortools.so.9" \
            cargo test --manifest-path src-tauri/Cargo.toml

      - run: npx --yes @tauri-apps/cli@2.12.4 build --config src-tauri/tauri.ortools.json

      - name: Is the AppImage whole
        run: |
          set -euo pipefail
          app=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -1)
          scripts/linux-paket.sh "$app"
          mkdir -p teslim
          cp "$app" teslim/Mozaik-linux-x86_64.AppImage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-appimage
          path: teslim/Mozaik-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

  # Açılıyor mu, dört sistemde. İki runner kendi FUSE'uyla, kullanıcının çift
  # tıklamasıyla aynı yoldan; iki kap (Debian 12, Fedora 42) FUSE'suz,
  # `--appimage-extract-and-run` ile. Kaplar asgari: bir masaüstünde kurulu
  # olan bir kütüphane orada eksik olabilir, o yüzden kırmızıları bu işi
  # kırmızı yapmaz ama özette ve günlükte görünür.
  acilis:
    needs: appimage
    strategy:
      fail-fast: false
      matrix:
        include:
          - ad: ubuntu-22.04
            runner: ubuntu-22.04
            fuse: libfuse2
            kap: ''
          - ad: ubuntu-24.04
            runner: ubuntu-24.04
            fuse: libfuse2t64
            kap: ''
          - ad: debian-12
            runner: ubuntu-24.04
            fuse: ''
            kap: debian:12@sha256:268fb24c39bca92d326dd83ea3abebe4a3f7751c804ffef23bb6d857dd343ff8
          - ad: fedora-42
            runner: ubuntu-24.04
            fuse: ''
            kap: fedora:42@sha256:99e203b80b1c3d8f7e161ec10a68fd02b081ef83a3963553e513c82846b97814
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.kap }}
    continue-on-error: ${{ matrix.kap != '' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/linux-acilis.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-appimage
          path: teslim

      - name: A virtual screen and a session bus
        run: |
          set -eu
          if [ -n "${{ matrix.fuse }}" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb dbus ${{ matrix.fuse }} >/dev/null
          elif command -v apt-get > /dev/null; then
            apt-get update -qq
            apt-get install -y -qq xvfb dbus fontconfig fonts-dejavu-core libgl1 libegl1 >/dev/null
          else
            dnf install -y -q xorg-x11-server-Xvfb dbus-daemon fontconfig dejavu-sans-fonts \
              mesa-libGL mesa-libEGL procps-ng >/dev/null
          fi

      - name: Does it start and stay up
        env:
          ACILIS_CIKTI: acilis-${{ matrix.ad }}
        run: |
          if [ -n "${{ matrix.kap }}" ]; then
            bash scripts/linux-acilis.sh teslim/Mozaik-linux-x86_64.AppImage --ayikla
          else
            bash scripts/linux-acilis.sh teslim/Mozaik-linux-x86_64.AppImage
          fi

      - name: Say it in the summary
        if: failure()
        run: echo "**Linux AppImage ${{ matrix.ad }} üzerinde açılmadı.** Günlük artefaktta." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: linux-acilis-${{ matrix.ad }}
          path: acilis-${{ matrix.ad }}/*
          if-no-files-found: ignore
