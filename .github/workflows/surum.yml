# Görev 4i, genişletilmiş: ÜÇ teslim yolunu da indirilebilir hâle getirmek.
#
# Bu dosya `exe.yml`'in yerine geçti. Sebep bir eksikti: `npm run …`
# çalıştırmadan indirilebilecek hiçbir şey yoktu. `dist/` .gitignore'da, ve
# bir Actions artefaktı GİRİŞ İSTER ve 90 günde silinir — yani babama
# verilebilecek bir bağlantı değil. Bir GitHub Release'in varlıkları ise
# kalıcı, açık ve girişsizdir, ve `releases/latest/download/<ad>` adresi
# sürüm numarası bilmeden en yenisine gider. README'nin bağlantıları bunlar.
#
# İlke 2 bozulmuyor: yayınlanan şey backend değil, üç dosya.
#
# ÜÇ VARLIK, ve üçü de aynı `dist/index.html`'i taşır:
#   Mozaik.html                  çift tıkla, tarayıcıda açılır
#   Mozaik-Windows-kurulum.zip   Kur.cmd + yerel sunucu
#   Mozaik.exe                   kendi penceresi, Belgelerim'e yazar
#
# ARTI BİR DÖRDÜNCÜ, ve o bir program değil bir CÜMLE: `surum.json`. Exe'nin
# "yeni sürüm var mı" diye sorduğu tek yer burasıdır
# (`src-tauri/src/update.rs`). `publish` işinde üretilir, çünkü içindeki
# `boyut` alanı ancak exe gerçekten derlendikten sonra bilinir; ve numarası
# ETİKETLE `package.json`'ın aynı olduğu doğrulanmadan yazılmaz. İkisi
# ayrışırsa exe kurulduktan sonra da kendini güncel saymaz ve aynı
# güncellemeyi sonsuza kadar önerir.
#
# VARLIK ADLARI SADECE ASCII. `.cmd` dosyalarının yalnız ASCII olmasıyla aynı
# aile: bir indirme bağlantısındaki "ı" harfi tarayıcıdan tarayıcıya farklı
# kodlanıyor. Babanın ekranda gördüğü ad zaten dosya adı değil — pencere
# başlığı da, kısayol adı da uygulamanın kendisinden geliyor.

name: release

on:
  # Bir etiket itilince YAYINLAR.
  push:
    tags: ['v*']
  # Elle koşturunca varsayılan olarak yalnız DERLER — üçü de artefakt olarak
  # iner, hiçbir şey yayınlanmaz. "Bir kez deneyelim" için olan yol budur.
  # The input NAMES are English because they are what the Actions UI shows;
  # everything else in this file is a comment for me.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish as a release (needs a tag name)'
        type: boolean
        default: false
      tag:
        description: 'Tag name, e.g. v1.1.0 — only when publishing'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------ 1 · package
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # `paket` zaten `build:site`'i çağırıyor; `build` ayrı, çünkü tek dosya
      # yolu ondan çıkıyor ve ikisi ayrı config.
      - run: npm run build
      - run: npm run paket

      # Satır sonları ve BOM burada ölçülür, Windows'ta değil: bir Linux
      # checkout'unda `* text=auto` bunlara LF verebilir ve Notepad OKU.txt'yi
      # tek satır gösterir. paket.mjs düzeltiyor — düzelttiği KANITLANIYOR.
      - name: Is the install folder in the shape Windows will read
        run: |
          set -o pipefail
          # `od` ile, `grep` ile DEĞİL: UTF-8 bir yerelde grep aynı üç baytı
          # desen olarak alıp eşleştiremiyor (yerelde ölçüldü — doğru
          # dosyalarda kırmızı verdi). Bayt karşılaştırması yerelden bağımsız.
          for f in kur.ps1 sunucu.ps1 OKU.txt; do
            bom=$(head -c3 "dist-kurulum/$f" | od -An -tx1 | tr -d ' \n')
            [ "$bom" = "efbbbf" ] \
              || { echo "$f BOM taşımıyor ($bom) — PowerShell 5.1 Türkçe harfleri bozar" >&2; exit 1; }
          done
          for f in kur.ps1 sunucu.ps1 OKU.txt Kur.cmd Guncelle.cmd; do
            file "dist-kurulum/$f" | grep -q CRLF \
              || { echo "$f CRLF değil" >&2; exit 1; }
          done
          if LC_ALL=C grep -qP '[\x80-\xFF]' dist-kurulum/Kur.cmd dist-kurulum/Guncelle.cmd; then
            echo ".cmd dosyaları yalnız ASCII olmalı — cmd.exe kod sayfası Türkçe harfleri bozuyor" >&2
            exit 1
          fi
          echo "BOM · CRLF · ASCII: üçü de doğru"

      - name: Name and zip
        run: |
          mkdir -p teslim
          cp dist/index.html "teslim/Mozaik.html"
          (cd dist-kurulum && zip -qr "../teslim/Mozaik-Windows-kurulum.zip" .)
          ls -l teslim

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: teslim/*
          if-no-files-found: error

  # ----------------------------------------------------------------- 2 · exe
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Sayfa ÖNCE derlenir: bir TypeScript hatası otuz saniyede düşsün,
      # Rust bağlama adımından sonra değil.
      - run: npm run build

      # Rust'ta yaşayan tek kural `safe_name` — exe'yi tek bir klasöre
      # hapseden kapı. `cargo test` onu yargılayabilen tek yer.
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - run: npx --yes @tauri-apps/cli@^2 build --no-bundle

      - name: Name it and MEASURE its size
        shell: pwsh
        run: |
          Write-Host "Measuring Mozaik.exe size..."
          $exe = "src-tauri/target/release/mozaik.exe"
          if (-not (Test-Path $exe)) {
            Get-ChildItem src-tauri/target/release -Filter *.exe
            throw "exe üretilmedi"
          }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "Mozaik.exe  $mb MB"
          New-Item -ItemType Directory -Force -Path teslim | Out-Null
          Copy-Item $exe "teslim/Mozaik.exe"

      # WHAT IS ACTUALLY IN THE BINARY, and this step exists because a sentence
      # in STATUS.md said it was ASSUMED. `bundle.icon` is supposed to embed
      # kurulum/icon.ico even under `--no-bundle`, and my father's "the taskbar
      # icon looks like 9x9 pixels" was read as evidence that it does not. It
      # does — measured on the published 2.0.0 binary: nine RT_ICON entries,
      # sizes byte-identical to the .ico. The cause was the drawing, and it was
      # fixed by moving the simplified-mark threshold.
      #
      # The gate stays because the assumption is what cost the time (pitfall
      # 65): if a Tauri upgrade ever stops embedding the icon, this turns red
      # in a build instead of turning up in a complaint six months later.
      - name: Are the icon and the version info REALLY embedded
        run: node scripts/exe-ikon.mjs teslim/Mozaik.exe --karsilastir kurulum/icon.ico
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: teslim/*
          if-no-files-found: error

  # ------------------------------------------------------------- 3 · publish
  publish:
    needs: [package, exe]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: indirilen

      - name: Did all three assets arrive
        run: |
          mkdir -p teslim && find indirilen -type f -exec mv {} teslim/ \;
          ls -l teslim
          for f in Mozaik.html Mozaik-Windows-kurulum.zip Mozaik.exe; do
            test -s "teslim/$f" || { echo "$f eksik ya da boş" >&2; exit 1; }
          done

      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/surum-notu.md
            package.json
          sparse-checkout-cone-mode: false
          path: depo

      # Exe'nin karşılaştıracağı numara, ve KİMİN söylediği önemli.
      #
      # Numara etiketten değil `package.json`'dan alınır: sayfaya basılan
      # `__SURUM__` odur (scripts/surum.mjs), yani exe kendini o numarayla
      # tanıtır. Etiket ondan başkaysa iş burada durur — yayınlanmış ama
      # kendini asla güncel sayamayan bir exe, hiç yayınlamamaktan kötüdür.
      - name: Build surum.json
        env:
          ETIKET: ${{ inputs.tag || github.ref_name }}
        run: |
          set -o pipefail
          surum=$(node -p "require('./depo/package.json').version")
          if [ "v$surum" != "$ETIKET" ]; then
            echo "package.json $surum diyor, etiket $ETIKET — ikisi aynı olmalı" >&2
            echo "  npm run yayinla -- $surum   (etiketi de o atar)" >&2
            exit 1
          fi
          boyut=$(stat -c%s teslim/Mozaik.exe)
          adres="https://github.com/${{ github.repository }}/releases/latest/download/Mozaik.exe"
          node -e "
            const fs = require('fs');
            fs.writeFileSync('teslim/surum.json', JSON.stringify({
              version: process.argv[1],
              date: new Date().toISOString().slice(0, 10),
              exe: process.argv[2],
              boyut: Number(process.argv[3]),
            }, null, 2) + '\n');
          " "$surum" "$adres" "$boyut"
          cat teslim/surum.json

      # WHAT WAS DOWNLOADED, in a form somebody can check. The .exe is unsigned
      # and always will be — a certificate costs money and the answer to that
      # was no — so "is this the file they published" has no answer from
      # Windows. It has one from a hash: `Get-FileHash Mozaik.exe` beside the
      # line in this file. It does not stop SmartScreen and is not meant to;
      # it is the one thing that can be offered in place of a signature.
      - name: Build SHA256SUMS.txt
        run: |
          set -o pipefail
          cd teslim
          sha256sum Mozaik.html Mozaik-Windows-kurulum.zip Mozaik.exe surum.json > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          # Elle koşuda etiket girdiden gelir; itilmiş bir etikette ref'ten.
          ETIKET: ${{ inputs.tag || github.ref_name }}
        run: |
          set -o pipefail
          if [ -z "$ETIKET" ]; then echo "etiket adı boş" >&2; exit 1; fi
          # `gh` runner'da zaten kurulu — sürüm yayınlamak gibi bir işe
          # üçüncü parti bir action sokmak, en az istenecek yerde yabancı kod
          # çalıştırmak olurdu.
          # Notu ayrı dosyadan: bir YAML blok skalerinin içine heredoc koymak
          # girintiyi bozuyor, ve notun kendisi düzenlenebilir kalmalı.
          gh release create "$ETIKET" \
            --repo "${{ github.repository }}" \
            --title "Mozaik $ETIKET" \
            --notes-file depo/.github/surum-notu.md \
            teslim/Mozaik.html \
            teslim/Mozaik-Windows-kurulum.zip \
            teslim/Mozaik.exe \
            teslim/surum.json \
            teslim/SHA256SUMS.txt
