# Görev 4i, genişletilmiş: ÜÇ teslim yolunu da indirilebilir hâle getirmek.
#
# Bu dosya `exe.yml`'in yerine geçti. Sebep bir eksikti: `npm run …`
# çalıştırmadan indirilebilecek hiçbir şey yoktu. `dist/` .gitignore'da, ve
# bir Actions artefaktı GİRİŞ İSTER ve 90 günde silinir — yani babama
# verilebilecek bir bağlantı değil. Bir GitHub Release'in varlıkları ise
# kalıcı, açık ve girişsizdir, ve `releases/latest/download/<ad>` adresi
# sürüm numarası bilmeden en yenisine gider. README'nin bağlantıları bunlar.
#
# Sunucusuz ilkesi bozulmuyor: yayınlanan şey backend değil, üç dosya.
#
# ÜÇ VARLIK, ve üçü de aynı `dist/index.html`'i taşır:
#   Mozaik.html                  çift tıkla, tarayıcıda açılır
#   Mozaik-Windows-kurulum.zip   Kur.cmd + yerel sunucu
#   Mozaik.exe                   kendi penceresi, Belgelerim'e yazar
#
# ARTI BİR DÖRDÜNCÜ, ve o bir program değil bir CÜMLE: `surum.json`. Exe'nin
# "yeni sürüm var mı" diye sorduğu tek yer burasıdır
# (`src-tauri/src/update.rs`). `publish` işinde üretilir, çünkü içindeki
# `boyut` alanı ancak exe gerçekten derlendikten sonra bilinir; ve numarası
# ETİKETLE `package.json`'ın aynı olduğu doğrulanmadan yazılmaz. İkisi
# ayrışırsa exe kurulduktan sonra da kendini güncel saymaz ve aynı
# güncellemeyi sonsuza kadar önerir.
#
# VARLIK ADLARI SADECE ASCII. `.cmd` dosyalarının yalnız ASCII olmasıyla aynı
# aile: bir indirme bağlantısındaki "ı" harfi tarayıcıdan tarayıcıya farklı
# kodlanıyor. Babanın ekranda gördüğü ad zaten dosya adı değil — pencere
# başlığı da, kısayol adı da uygulamanın kendisinden geliyor.

name: release

on:
  # Bir etiket itilince YAYINLAR.
  push:
    tags: ['v*']
  # Elle koşturunca varsayılan olarak yalnız DERLER — üçü de artefakt olarak
  # iner, hiçbir şey yayınlanmaz. "Bir kez deneyelim" için olan yol budur.
  # The input NAMES are English because they are what the Actions UI shows;
  # everything else in this file is a comment for me.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish as a release (needs a tag name)'
        type: boolean
        default: false
      tag:
        description: 'Tag name, e.g. v1.1.0 — only when publishing'
        type: string
        default: ''

# Okuma, yalnız yayınlayan iş yazar (aşağıda, `publish`): derleme adımları
# (`npm ci`, Tauri CLI) yazma yetkili bir token görmesin (güvenlik denetimi 2026-11-15).
permissions:
  contents: read

jobs:
  # ------------------------------------------------------------ 1 · package
  package:
    runs-on: ubuntu-24.04 # geçici (TODO B7.29): Ubuntu 26'da Playwright/WebKit bağımlılıkları doğrulanınca ubuntu-latest'e dön
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # `paket` zaten `build:site`'i çağırıyor; `build` ayrı, çünkü tek dosya
      # yolu ondan çıkıyor ve ikisi ayrı config.
      - run: npm run build
      - run: npm run paket

      # Satır sonları ve BOM burada ölçülür, Windows'ta değil: bir Linux
      # checkout'unda `* text=auto` bunlara LF verebilir ve Notepad OKU.txt'yi
      # tek satır gösterir. paket.mjs düzeltiyor — düzelttiği KANITLANIYOR.
      - name: Is the install folder in the shape Windows will read
        run: |
          set -o pipefail
          # `od` ile, `grep` ile DEĞİL: UTF-8 bir yerelde grep aynı üç baytı
          # desen olarak alıp eşleştiremiyor (yerelde ölçüldü — doğru
          # dosyalarda kırmızı verdi). Bayt karşılaştırması yerelden bağımsız.
          for f in kur.ps1 sunucu.ps1 OKU.txt; do
            bom=$(head -c3 "dist-kurulum/$f" | od -An -tx1 | tr -d ' \n')
            [ "$bom" = "efbbbf" ] \
              || { echo "$f BOM taşımıyor ($bom) — PowerShell 5.1 Türkçe harfleri bozar" >&2; exit 1; }
          done
          for f in kur.ps1 sunucu.ps1 OKU.txt Kur.cmd Guncelle.cmd; do
            file "dist-kurulum/$f" | grep -q CRLF \
              || { echo "$f CRLF değil" >&2; exit 1; }
          done
          if LC_ALL=C grep -qP '[\x80-\xFF]' dist-kurulum/Kur.cmd dist-kurulum/Guncelle.cmd; then
            echo ".cmd dosyaları yalnız ASCII olmalı — cmd.exe kod sayfası Türkçe harfleri bozuyor" >&2
            exit 1
          fi
          echo "BOM · CRLF · ASCII: üçü de doğru"

      - name: Name and zip
        run: |
          mkdir -p teslim
          cp dist/index.html "teslim/Mozaik.html"
          (cd dist-kurulum && zip -qr "../teslim/Mozaik-Windows-kurulum.zip" .)
          ls -l teslim

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: teslim/*
          if-no-files-found: error

  # ----------------------------------------------------------------- 2 · exe
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable dalı, 2026-11-15
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Sayfa ÖNCE derlenir: bir TypeScript hatası otuz saniyede düşsün,
      # Rust bağlama adımından sonra değil.
      - run: npm run build

      # Rust'ta yaşayan tek kural `safe_name` — exe'yi tek bir klasöre
      # hapseden kapı. `cargo test` onu yargılayabilen tek yer.
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      # Bundle ile: aynı derleme hem tek başına `Mozaik.exe`'yi
      # (target/release) hem kurulum sihirbazını (bundle/nsis) üretir
      # (DECISIONS 2026-11-15). Eski kopyalar tek dosyayla güncellenmeye devam
      # eder, yenileri kurulumu indirir (update.rs, `karar`).
      - run: npx --yes @tauri-apps/cli@2.12.4 build

      # İKİ ADA DA BAKIYOR, ve sebebi ölçülmüş bir kırıklık: v2.0.3 koşusu tam
      # burada düştü (`tauri build` başarılı, bu adım başarısız) ve o yüzden
      # `latest` v2.0.2'de kaldı. Tauri ikiliyi Cargo paket adıyla üretip
      # `productName`'e göre YENİDEN ADLANDIRIYOR; o yeniden adlandırma
      # atlanırsa dosya `ders-programi.exe` kalır, ve tek ada bakan bir adım
      # "exe üretilmedi" der — üretilmişken.
      #
      # Teslim edilen ad her iki durumda da `Mozaik.exe`: bulunan dosya oraya
      # KOPYALANIYOR. Hangisi bulunduysa loga yazılır, çünkü bir sonraki sefer
      # sorulacak soru "hangisi vardı" olacak.
      - name: Name it and MEASURE its size
        shell: pwsh
        run: |
          Write-Host "Measuring Mozaik.exe size..."
          $aday = @(
            "src-tauri/target/release/Mozaik.exe",
            "src-tauri/target/release/ders-programi.exe"
          )
          $exe = $aday | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            Write-Host "Aranan adlar bulunamadı; klasörde duranlar:"
            Get-ChildItem src-tauri/target/release -Filter *.exe
            throw "exe üretilmedi"
          }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "$exe  ->  Mozaik.exe  $mb MB"
          New-Item -ItemType Directory -Force -Path teslim | Out-Null
          Copy-Item $exe "teslim/Mozaik.exe"

      # Kurulumun kendisi, ve içine bizim iki kancamızın girdiği. Kanca
      # girmezse kaldırıcının "uygulama verilerini sil" kutusu babanın bütün
      # planlarını siler (src-tauri/nsis/kancalar.nsh): bu adım o kurulumu
      # yayına sokmaz. Tauri'nin ürettiği betik `target/release/nsis/x64/`'te.
      - name: Installer, with our hooks in it
        shell: pwsh
        run: |
          $nsi = Get-ChildItem src-tauri/target/release/nsis -Recurse -Filter installer.nsi | Select-Object -First 1
          if (-not $nsi) { throw "installer.nsi bulunamadı" }
          # Tauri kanca dosyasını kopyalamaz, `!include` ile bağlar: önce
          # betiğin onu içeri aldığı, sonra dosyanın iki kuralı taşıdığı.
          $metin = Get-Content $nsi.FullName -Raw
          if ($metin -notmatch '!include\s+"[^"]*kancalar\.nsh"') {
            Write-Host ($metin -split "`n" | Select-String -Pattern 'include' | Out-String)
            throw "kurulum betiği kancalar.nsh'i içeri almıyor"
          }
          $kanca = Get-Content src-tauri/nsis/kancalar.nsh -Raw
          foreach ($iz in @('StrCpy $DeleteAppDataCheckboxState 0', '$LOCALAPPDATA\Programs\${PRODUCTNAME}')) {
            if (-not $kanca.Contains($iz)) { throw "kanca dosyasında yok: $iz" }
          }
          $kur = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          if (-not $kur) { throw "kurulum üretilmedi" }
          $mb = [math]::Round($kur.Length / 1MB, 2)
          Write-Host "$($kur.Name)  ->  Mozaik-Kurulum.exe  $mb MB"
          Copy-Item $kur.FullName "teslim/Mozaik-Kurulum.exe"

      # WHAT IS ACTUALLY IN THE BINARY, and this step exists because a sentence
      # in WORKLOG.md said it was ASSUMED. `bundle.icon` is supposed to embed
      # kurulum/icon.ico even under `--no-bundle`, and my father's "the taskbar
      # icon looks like 9x9 pixels" was read as evidence that it does not. It
      # does — measured on the published 2.0.0 binary: nine RT_ICON entries,
      # sizes byte-identical to the .ico. The cause was the drawing, and it was
      # fixed by moving the simplified-mark threshold.
      #
      # The gate stays because the assumption is what cost the time (pitfall
      # 65): if a Tauri upgrade ever stops embedding the icon, this turns red
      # in a build instead of turning up in a complaint six months later.
      - name: Are the icon and the version info REALLY embedded
        run: node scripts/exe-ikon.mjs teslim/Mozaik.exe --karsilastir kurulum/icon.ico
      - uses: actions/upload-artifact@v7
        with:
          name: exe
          path: teslim/*
          if-no-files-found: error

  # ------------------------------------------------------------- 3 · publish
  publish:
    needs: [package, exe]
    permissions:
      contents: write
    runs-on: ubuntu-24.04 # geçici (TODO B7.29): Ubuntu 26'da Playwright/WebKit bağımlılıkları doğrulanınca ubuntu-latest'e dön
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: indirilen

      - name: Did all three assets arrive
        run: |
          mkdir -p teslim && find indirilen -type f -exec mv {} teslim/ \;
          ls -l teslim
          for f in Mozaik.html Mozaik-Windows-kurulum.zip Mozaik.exe Mozaik-Kurulum.exe; do
            test -s "teslim/$f" || { echo "$f eksik ya da boş" >&2; exit 1; }
          done

      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/surum-notu.md
            package.json
            CHANGELOG.md
            src/platform/changelog.ts
            scripts/surum-notu.mjs
          sparse-checkout-cone-mode: false
          path: depo

      # Exe'nin karşılaştıracağı numara, ve KİMİN söylediği önemli.
      #
      # Numara etiketten değil `package.json`'dan alınır: sayfaya basılan
      # `__SURUM__` odur (scripts/surum.mjs), yani exe kendini o numarayla
      # tanıtır. Etiket ondan başkaysa iş burada durur — yayınlanmış ama
      # kendini asla güncel sayamayan bir exe, hiç yayınlamamaktan kötüdür.
      # İMZA (güvenlik denetimi 2026-11-15). Özet aynı Release'ten geliyor, yani
      # dosyanın eksiksiz indiğini söylüyor ama bizim olduğunu söylemiyor; imza
      # söylüyor. Anahtarın gizli yarısı depo sırrı MOZAIK_IMZA_ANAHTARI, açık
      # yarısı update.rs'in IMZA_ANAHTARI'sı. Sır yoksa yayın burada durur:
      # imzasız bir sürümü yeni kopyalar kurmaz, eskileri ise hiç doğrulamaz.
      - name: Sign the two programs
        env:
          ANAHTAR: ${{ secrets.MOZAIK_IMZA_ANAHTARI }}
        run: |
          test -n "$ANAHTAR" || { echo "MOZAIK_IMZA_ANAHTARI sırrı tanımlı değil" >&2; exit 1; }
          sudo apt-get install -y -qq minisign >/dev/null
          gizli=$(mktemp -d); chmod 700 "$gizli"
          umask 077; printf '%s\n' "$ANAHTAR" > "$gizli/anahtar"
          # Güvenilen yorum sürümü ve dosyayı bağlıyor (update.rs, `imza_yorumu`):
          # eski imzalı bir sürüm yenisi diye, ya da bir dosya ötekinin yerine
          # sunulamaz.
          surum=$(node -p "require('./depo/package.json').version")
          minisign -S -s "$gizli/anahtar" -m teslim/Mozaik.exe -x imza-exe.minisig \
            -t "mozaik $surum Mozaik.exe"
          minisign -S -s "$gizli/anahtar" -m teslim/Mozaik-Kurulum.exe -x imza-kurulum.minisig \
            -t "mozaik $surum Mozaik-Kurulum.exe"
          rm -rf "$gizli"

      - name: Build surum.json
        env:
          ETIKET: ${{ inputs.tag || github.ref_name }}
        run: |
          set -o pipefail
          surum=$(node -p "require('./depo/package.json').version")
          if [ "v$surum" != "$ETIKET" ]; then
            echo "package.json $surum diyor, etiket $ETIKET — ikisi aynı olmalı" >&2
            echo "  npm run yayinla -- $surum   (etiketi de o atar)" >&2
            exit 1
          fi
          boyut=$(stat -c%s teslim/Mozaik.exe)
          # The digest update.rs holds the download against (2026-10-24): the
          # same file, the same sha256sum line SHA256SUMS.txt carries.
          ozet=$(sha256sum teslim/Mozaik.exe | cut -d' ' -f1)
          kurulum_boyut=$(stat -c%s teslim/Mozaik-Kurulum.exe)
          kurulum_ozet=$(sha256sum teslim/Mozaik-Kurulum.exe | cut -d' ' -f1)
          # ADRES DEPONUN BUGÜNKÜ ADINDAN GELMEZ, ve bu bilerek.
          #
          # `update.rs`'in kabul ettiği adres önekleri, dağıtılmış her exe'nin
          # İÇİNE derlenmiş. Depo `ders-programi` -> `Mozaik` olunca
          # yayınlanmış v2.0.2 yeni adı tanımadı: "Güncellemeleri denetle"
          # `Beklenmeyen adres: ...` dedi ve o kopya bir daha güncellenemez
          # hâle geldi. O ikiliyi artık değiştiremeyiz; değiştirebileceğimiz
          # tek şey manifestteki adres.
          #
          # GitHub eski adı yeni ada 301'liyor (ölçüldü 2026-08-31), yani ESKİ
          # adla yazılmış bir adres HER İKİ tarafı da memnun eder: eski kopya
          # öneki tanır ve yönlendirmeyi izler, buradan derlenen kopya da onu
          # tanır (RELEASE_KOKLERI iki adı da taşır, ve src/surum.test.ts bu
          # satırın o listeyle uyuştuğunu her koşuda ölçer).
          #
          # Bunu yeni ada çevirmenin şartı: babanın makinesindeki exe >= 2.0.4.
          adres="https://github.com/AlparslanSemiz/ders-programi/releases/latest/download/Mozaik.exe"
          # Kurulum aynı önekte. Eski kopyalar bu iki alanı tanımaz ve
          # yukarıdaki tek dosyayı indirmeye devam eder (köprü, update.rs).
          kurulum="https://github.com/AlparslanSemiz/ders-programi/releases/latest/download/Mozaik-Kurulum.exe"
          node -e "
            const fs = require('fs');
            fs.writeFileSync('teslim/surum.json', JSON.stringify({
              version: process.argv[1],
              date: new Date().toISOString().slice(0, 10),
              exe: process.argv[2],
              boyut: Number(process.argv[3]),
              sha256: process.argv[4],
              kurulum: process.argv[5],
              kurulum_boyut: Number(process.argv[6]),
              kurulum_sha256: process.argv[7],
              imza: fs.readFileSync('imza-exe.minisig', 'utf8'),
              kurulum_imza: fs.readFileSync('imza-kurulum.minisig', 'utf8'),
            }, null, 2) + '\n');
          " "$surum" "$adres" "$boyut" "$ozet" "$kurulum" "$kurulum_boyut" "$kurulum_ozet"
          cat teslim/surum.json

      # WHAT WAS DOWNLOADED, in a form somebody can check. The .exe is unsigned
      # and always will be — a certificate costs money and the answer to that
      # was no — so "is this the file they published" has no answer from
      # Windows. It has one from a hash: `Get-FileHash Mozaik.exe` beside the
      # line in this file. It does not stop SmartScreen and is not meant to;
      # it is the one thing that can be offered in place of a signature.
      - name: Build SHA256SUMS.txt
        run: |
          set -o pipefail
          cd teslim
          sha256sum Mozaik.html Mozaik-Windows-kurulum.zip Mozaik.exe Mozaik-Kurulum.exe surum.json > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # WHAT IS NEW, on the Release page itself: the Turkish lines Ayarlar →
      # Hakkında shows, the version's CHANGELOG.md section, then the install
      # text every release shares. The page used to carry the install text
      # alone. A version with nothing to say stops here (scripts/surum-notu.mjs).
      - name: Build the release notes
        env:
          ETIKET: ${{ inputs.tag || github.ref_name }}
        run: |
          set -o pipefail
          node depo/scripts/surum-notu.mjs "${ETIKET#v}" depo > notlar.md
          cat notlar.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          # Elle koşuda etiket girdiden gelir; itilmiş bir etikette ref'ten.
          ETIKET: ${{ inputs.tag || github.ref_name }}
        run: |
          set -o pipefail
          if [ -z "$ETIKET" ]; then echo "etiket adı boş" >&2; exit 1; fi
          # `gh` runner'da zaten kurulu — sürüm yayınlamak gibi bir işe
          # üçüncü parti bir action sokmak, en az istenecek yerde yabancı kod
          # çalıştırmak olurdu.
          # Notu ayrı dosyadan: bir YAML blok skalerinin içine heredoc koymak
          # girintiyi bozuyor. Dosyayı bir önceki adım kuruyor.
          gh release create "$ETIKET" \
            --repo "${{ github.repository }}" \
            --title "Mozaik $ETIKET" \
            --notes-file notlar.md \
            teslim/Mozaik.html \
            teslim/Mozaik-Windows-kurulum.zip \
            teslim/Mozaik.exe \
            teslim/Mozaik-Kurulum.exe \
            teslim/surum.json \
            teslim/SHA256SUMS.txt
