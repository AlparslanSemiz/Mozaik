# Görev 4i, genişletilmiş: ÜÇ teslim yolunu da indirilebilir hâle getirmek.
#
# Bu dosya `exe.yml`'in yerine geçti. Sebep bir eksikti: `npm run …`
# çalıştırmadan indirilebilecek hiçbir şey yoktu. `dist/` .gitignore'da, ve
# bir Actions artefaktı GİRİŞ İSTER ve 90 günde silinir — yani babama
# verilebilecek bir bağlantı değil. Bir GitHub Release'in varlıkları ise
# kalıcı, açık ve girişsizdir, ve `releases/latest/download/<ad>` adresi
# sürüm numarası bilmeden en yenisine gider. README'nin bağlantıları bunlar.
#
# Sunucusuz ilkesi bozulmuyor: yayınlanan şey backend değil, üç dosya.
#
# ÜÇ VARLIK, ve üçü de aynı `dist/index.html`'i taşır:
#   Mozaik.html                  çift tıkla, tarayıcıda açılır
#   Mozaik-Windows-kurulum.zip   Kur.cmd + yerel sunucu
#   Mozaik.exe                   kendi penceresi, Belgelerim'e yazar
#
# 2026-11-15'ten beri bir de Mac (DECISIONS, "Mac sürümü"), mimari başına iki
# dosya: ilk kurulum için `Mozaik-mac-<mimari>.dmg`, kendini güncelleme için
# `Mozaik-mac-<mimari>.app.tar.gz` (update_mac.rs). Apple imzası yok, yalnız
# ad-hoc; güncellemeyi bizim minisign imzamız korur, Windows'takiyle aynı.
#
# 2026-11-16'dan beri bir de Linux (DECISIONS, "Linux sürümü"): tek dosya,
# `Mozaik-linux-x86_64.AppImage`, hem ilk kurulum hem kendini güncelleme için
# (update_linux.rs). Aynı minisign imzası; Mac gibi hiçbir şeyi engellemez.
#
# ARTI BİR DÖRDÜNCÜ, ve o bir program değil bir CÜMLE: `surum.json`. Exe'nin
# "yeni sürüm var mı" diye sorduğu tek yer burasıdır
# (`src-tauri/src/update.rs`). `publish` işinde üretilir, çünkü içindeki
# `boyut` alanı ancak exe gerçekten derlendikten sonra bilinir; ve numarası
# ETİKETLE `package.json`'ın aynı olduğu doğrulanmadan yazılmaz. İkisi
# ayrışırsa exe kurulduktan sonra da kendini güncel saymaz ve aynı
# güncellemeyi sonsuza kadar önerir.
#
# VARLIK ADLARI SADECE ASCII. `.cmd` dosyalarının yalnız ASCII olmasıyla aynı
# aile: bir indirme bağlantısındaki "ı" harfi tarayıcıdan tarayıcıya farklı
# kodlanıyor. Babanın ekranda gördüğü ad zaten dosya adı değil — pencere
# başlığı da, kısayol adı da uygulamanın kendisinden geliyor.

name: release

on:
  # Bir etiket itilince YAYINLAR.
  push:
    tags: ['v*']
  # Elle koşturunca varsayılan olarak yalnız DERLER — üçü de artefakt olarak
  # iner, hiçbir şey yayınlanmaz. "Bir kez deneyelim" için olan yol budur.
  # The input NAMES are English because they are what the Actions UI shows;
  # everything else in this file is a comment for me.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish as a release (needs a tag name)'
        type: boolean
        default: false
      tag:
        description: 'Tag name, e.g. v1.1.0 — only when publishing'
        type: string
        default: ''

# Okuma, yalnız yayınlayan iş yazar (aşağıda, `publish`): derleme adımları
# (`npm ci`, Tauri CLI) yazma yetkili bir token görmesin (güvenlik denetimi 2026-11-15).
permissions:
  contents: read

# ÖNBELLEK YOK (güvenlik denetimi 2026-11-16): ne `setup-node`'un npm önbelleği
# ne rust-cache. Önbellek başka dallardaki koşulardan da beslenir; imzalanacak
# ikili ondan geri yüklenmiş bir hedef klasörden derlenmesin. Bedeli dakikalar.

jobs:
  # ------------------------------------------------------------ 1 · package
  package:
    runs-on: ubuntu-24.04 # geçici (TODO B7.29): Ubuntu 26'da Playwright/WebKit bağımlılıkları doğrulanınca ubuntu-latest'e dön
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Kurulum betikleri koşmaz: bir bağımlılığın `postinstall`'ı imzalanacak
      # programa dokunamasın. Lock'ta betiği olan tek paket fsevents (yalnız
      # macOS); esbuild ve rolldown'un ikilileri optionalDependencies'ten iner.
      - run: npm ci --ignore-scripts

      # `paket` zaten `build:site`'i çağırıyor; `build` ayrı, çünkü tek dosya
      # yolu ondan çıkıyor ve ikisi ayrı config.
      - run: npm run build
      - run: npm run paket

      # Satır sonları ve BOM burada ölçülür, Windows'ta değil: bir Linux
      # checkout'unda `* text=auto` bunlara LF verebilir ve Notepad OKU.txt'yi
      # tek satır gösterir. paket.mjs düzeltiyor — düzelttiği KANITLANIYOR.
      - name: Is the install folder in the shape Windows will read
        run: |
          set -o pipefail
          # `od` ile, `grep` ile DEĞİL: UTF-8 bir yerelde grep aynı üç baytı
          # desen olarak alıp eşleştiremiyor (yerelde ölçüldü — doğru
          # dosyalarda kırmızı verdi). Bayt karşılaştırması yerelden bağımsız.
          for f in kur.ps1 sunucu.ps1 OKU.txt; do
            bom=$(head -c3 "dist-kurulum/$f" | od -An -tx1 | tr -d ' \n')
            [ "$bom" = "efbbbf" ] \
              || { echo "$f BOM taşımıyor ($bom) — PowerShell 5.1 Türkçe harfleri bozar" >&2; exit 1; }
          done
          for f in kur.ps1 sunucu.ps1 OKU.txt Kur.cmd Guncelle.cmd; do
            file "dist-kurulum/$f" | grep -q CRLF \
              || { echo "$f CRLF değil" >&2; exit 1; }
          done
          if LC_ALL=C grep -qP '[\x80-\xFF]' dist-kurulum/Kur.cmd dist-kurulum/Guncelle.cmd; then
            echo ".cmd dosyaları yalnız ASCII olmalı — cmd.exe kod sayfası Türkçe harfleri bozuyor" >&2
            exit 1
          fi
          echo "BOM · CRLF · ASCII: üçü de doğru"

      - name: Name and zip
        run: |
          mkdir -p teslim
          cp dist/index.html "teslim/Mozaik.html"
          (cd dist-kurulum && zip -qr "../teslim/Mozaik-Windows-kurulum.zip" .)
          ls -l teslim

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: teslim/*
          if-no-files-found: error

  # ----------------------------------------------------------------- 2 · exe
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable dalı, 2026-11-15
        with:
          toolchain: stable

      # Kurulum betikleri koşmaz: bir bağımlılığın `postinstall`'ı imzalanacak
      # programa dokunamasın. Lock'ta betiği olan tek paket fsevents (yalnız
      # macOS); esbuild ve rolldown'un ikilileri optionalDependencies'ten iner.
      - run: npm ci --ignore-scripts

      # Sayfa ÖNCE derlenir: bir TypeScript hatası otuz saniyede düşsün,
      # Rust bağlama adımından sonra değil.
      - run: npm run build

      # Rust'ta yaşayan tek kural `safe_name` — exe'yi tek bir klasöre
      # hapseden kapı. `cargo test` onu yargılayabilen tek yer.
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      # OR-Tools CP-SAT, öneri araması için (DECISIONS 2026-11-15, src-tauri/src/cpsat.rs).
      # Resmi sürümün arşivi, SHA-256'sı sabit: başka bir dosya bu adımı geçemez.
      # Kuruluma giren 9 DLL `ortools.dll`'in içe aktarma tablosundan, Visual C++
      # çalışma zamanı da yanında (babanın makinesinde kurulu olmayabilir).
      # Yalnız kurulum alır; tek başına exe ve geliştirme derlemesi kütüphanesiz
      # kalır ve sayfa kendi aramasına düşer.
      - name: OR-Tools CP-SAT for the installer
        shell: pwsh
        run: |
          $surum = "9.15.6755"
          $ad = "or-tools_x64_VisualStudio2022_cpp_v$surum"
          $url = "https://github.com/google/or-tools/releases/download/v9.15/$ad.zip"
          $beklenen = "43429C741641C8B495EE77E44EA00F0F4524519495FD2EDAF929003AA2B2EA30"
          Invoke-WebRequest $url -OutFile ortools.zip
          $hash = (Get-FileHash ortools.zip -Algorithm SHA256).Hash
          if ($hash -ne $beklenen) { throw "OR-Tools arşivinin özeti tutmuyor: $hash" }
          Expand-Archive ortools.zip -DestinationPath ortools-acik
          $bin = "ortools-acik/$ad/bin"
          New-Item -ItemType Directory -Force -Path src-tauri/ortools | Out-Null
          $dll = @('ortools.dll','abseil_dll.dll','bz2.dll','highs.dll','libprotobuf.dll',
                   'libscip.dll','libutf8_validity.dll','re2.dll','zlib1.dll')
          foreach ($d in $dll) { Copy-Item "$bin/$d" src-tauri/ortools/ }
          $crt = @('msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll')
          foreach ($d in $crt) { Copy-Item "$env:WINDIR/System32/$d" src-tauri/ortools/ }
          $kaynak = @{}
          foreach ($d in $dll + $crt) { $kaynak["ortools/$d"] = $d }
          $kaynak["lisanslar/UCUNCU-TARAF.txt"] = "UCUNCU-TARAF.txt"
          @{ bundle = @{ resources = $kaynak } } | ConvertTo-Json -Depth 4 |
            Set-Content src-tauri/tauri.ortools.json -Encoding utf8
          Get-Content src-tauri/tauri.ortools.json
          Get-ChildItem src-tauri/ortools | ForEach-Object { "{0,-24} {1,8:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      # Bundle ile: aynı derleme hem tek başına `Mozaik.exe`'yi
      # (target/release) hem kurulum sihirbazını (bundle/nsis) üretir
      # (DECISIONS 2026-11-15). Eski kopyalar tek dosyayla güncellenmeye devam
      # eder, yenileri kurulumu indirir (update.rs, `karar`).
      - run: npx --yes @tauri-apps/cli@2.12.4 build --config src-tauri/tauri.ortools.json

      # İKİ ADA DA BAKIYOR, ve sebebi ölçülmüş bir kırıklık: v2.0.3 koşusu tam
      # burada düştü (`tauri build` başarılı, bu adım başarısız) ve o yüzden
      # `latest` v2.0.2'de kaldı. Tauri ikiliyi Cargo paket adıyla üretip
      # `productName`'e göre YENİDEN ADLANDIRIYOR; o yeniden adlandırma
      # atlanırsa dosya `ders-programi.exe` kalır, ve tek ada bakan bir adım
      # "exe üretilmedi" der — üretilmişken.
      #
      # Teslim edilen ad her iki durumda da `Mozaik.exe`: bulunan dosya oraya
      # KOPYALANIYOR. Hangisi bulunduysa loga yazılır, çünkü bir sonraki sefer
      # sorulacak soru "hangisi vardı" olacak.
      - name: Name it and MEASURE its size
        shell: pwsh
        run: |
          Write-Host "Measuring Mozaik.exe size..."
          $aday = @(
            "src-tauri/target/release/Mozaik.exe",
            "src-tauri/target/release/ders-programi.exe"
          )
          $exe = $aday | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            Write-Host "Aranan adlar bulunamadı; klasörde duranlar:"
            Get-ChildItem src-tauri/target/release -Filter *.exe
            throw "exe üretilmedi"
          }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "$exe  ->  Mozaik.exe  $mb MB"
          New-Item -ItemType Directory -Force -Path teslim | Out-Null
          Copy-Item $exe "teslim/Mozaik.exe"

      # Kurulumun kendisi, ve içine bizim iki kancamızın girdiği. Kanca
      # girmezse kaldırıcının "uygulama verilerini sil" kutusu babanın bütün
      # planlarını siler (src-tauri/nsis/kancalar.nsh): bu adım o kurulumu
      # yayına sokmaz. Tauri'nin ürettiği betik `target/release/nsis/x64/`'te.
      - name: Installer, with our hooks in it
        shell: pwsh
        run: |
          $nsi = Get-ChildItem src-tauri/target/release/nsis -Recurse -Filter installer.nsi | Select-Object -First 1
          if (-not $nsi) { throw "installer.nsi bulunamadı" }
          # Tauri kanca dosyasını kopyalamaz, `!include` ile bağlar: önce
          # betiğin onu içeri aldığı, sonra dosyanın iki kuralı taşıdığı.
          $metin = Get-Content $nsi.FullName -Raw
          if ($metin -notmatch '!include\s+"[^"]*kancalar\.nsh"') {
            Write-Host ($metin -split "`n" | Select-String -Pattern 'include' | Out-String)
            throw "kurulum betiği kancalar.nsh'i içeri almıyor"
          }
          # CP-SAT kuruluma girdi mi: girmezse program yine çalışır ama yavaş
          # yoldan, ve bunu kimse fark etmez.
          foreach ($d in @('ortools.dll', 'libprotobuf.dll', 'vcruntime140.dll', 'UCUNCU-TARAF.txt')) {
            if (-not $metin.Contains("/oname=$d")) { throw "kurulum $d taşımıyor" }
          }
          $kanca = Get-Content src-tauri/nsis/kancalar.nsh -Raw
          foreach ($iz in @('StrCpy $DeleteAppDataCheckboxState 0', '$LOCALAPPDATA\Programs\${PRODUCTNAME}')) {
            if (-not $kanca.Contains($iz)) { throw "kanca dosyasında yok: $iz" }
          }
          $kur = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          if (-not $kur) { throw "kurulum üretilmedi" }
          $mb = [math]::Round($kur.Length / 1MB, 2)
          Write-Host "$($kur.Name)  ->  Mozaik-Kurulum.exe  $mb MB"
          Copy-Item $kur.FullName "teslim/Mozaik-Kurulum.exe"

      # WHAT IS ACTUALLY IN THE BINARY, and this step exists because a sentence
      # in WORKLOG.md said it was ASSUMED. `bundle.icon` is supposed to embed
      # kurulum/icon.ico even under `--no-bundle`, and my father's "the taskbar
      # icon looks like 9x9 pixels" was read as evidence that it does not. It
      # does — measured on the published 2.0.0 binary: nine RT_ICON entries,
      # sizes byte-identical to the .ico. The cause was the drawing, and it was
      # fixed by moving the simplified-mark threshold.
      #
      # The gate stays because the assumption is what cost the time (pitfall
      # 65): if a Tauri upgrade ever stops embedding the icon, this turns red
      # in a build instead of turning up in a complaint six months later.
      - name: Are the icon and the version info REALLY embedded
        run: node scripts/exe-ikon.mjs teslim/Mozaik.exe --karsilastir kurulum/icon.ico
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exe
          path: teslim/*
          if-no-files-found: error

  # ----------------------------------------------------------------- 3 · mac
  # Mozaik.app, iki mimari için ayrı (BUILD.md, "Mac"): OR-Tools her mimariye
  # ayrı arşiv yayımlıyor ve 99 dylib'i `lipo` ile tek tek birleştirmek, her
  # Mac'e iki kat büyük bir indirme demek. İkisi de Apple Silicon bir runner'da
  # derlenir; x86_64 çapraz derleme, Rust'ın kendi hedefiyle.
  #
  # APPLE İMZASI BİR ANAHTAR: `APPLE_CERTIFICATE` sırrı tanımlıysa Tauri
  # Developer ID ile imzalar (ve `APPLE_ID` üçlüsü de varsa notarize eder);
  # tanımlı değilse ad-hoc imza (`signingIdentity: "-"`, tauri.macos.conf.json),
  # ki Apple Silicon imzasız bir programı hiç çalıştırmaz. Bugün sır yok
  # (DECISIONS 2026-11-15): ilk açılışta "Yine de Aç" gerekir (docs/INSTALL.md, "Mac").
  #
  # MAC HİÇBİR ŞEYİ ENGELLEMEZ (Alp, 2026-11-16: Windows ve web önce). Bu iş
  # kırmızıysa ya da hiç koşmadıysa `publish` yine Windows'u ve surum.json'ı
  # yayınlar; o sürümde Mac paketi olmaz ve Mac kopyaları güncelleme görmez.
  # İki mimari birbirini de engellemez (`fail-fast: false`).
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - mimari: arm64
            hedef: aarch64-apple-darwin
          - mimari: x86_64
            hedef: x86_64-apple-darwin
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable dalı, 2026-11-15
        with:
          toolchain: stable
          targets: ${{ matrix.hedef }}

      # Betiksiz ve önbelleksiz, Windows işi gibi (yukarıda, ve BUILD.md
      # "Yayın güvenliği"). OR-Tools'u npm değil `ortools-mac.sh` getiriyor.
      - run: npm ci --ignore-scripts
      - run: npm run build

      # OR-Tools'un resmi macOS arşivi, SHA-256'sı betikte sabit; .app'e
      # `libortools.9.dylib`'in yüklediği dylib'lerin kapanışı girer.
      - name: OR-Tools CP-SAT for the .app
        run: scripts/ortools-mac.sh ${{ matrix.mimari }}

      # Rust testleri ve CP-SAT'ın küçük modeli, yalnız runner'ın kendi
      # mimarisinde (çapraz derlenen x86_64 burada koşamaz).
      - name: cargo test, with the CP-SAT tiny model
        if: matrix.mimari == 'arm64'
        run: |
          MOZAIK_ORTOOLS="$PWD/src-tauri/ortools/libortools.9.dylib" \
            cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Mozaik.app and the .dmg
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Boş bir sır yine de tanımlı bir değişkendir ve Tauri onu dener:
          # sır yoksa değişken hiç yok, her biri ayrı ayrı.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            echo "Developer ID ile imzalanıyor"
            # Sertleştirilmiş çalışma zamanı her durumda açık (tauri.macos.conf.json).
            # Aynı ekip kimliğiyle imzalanan dylib'ler kütüphane doğrulamasından
            # geçer, yani ad-hoc'un ihtiyacı olan istisna burada çıkarılır
            # (`null` birleştirmede anahtarı siler).
            node -e '
              const fs = require("fs"), y = "src-tauri/tauri.ortools.json";
              const c = JSON.parse(fs.readFileSync(y, "utf8"));
              c.bundle.macOS.entitlements = null;
              fs.writeFileSync(y, JSON.stringify(c, null, 2));'
            # Notarization üçü birden ister; eksik bir üçlü hiç verilmez.
            if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
              unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            fi
          else
            echo "Apple imzası yok: ad-hoc"
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
              APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          npx --yes @tauri-apps/cli@2.12.4 build --config src-tauri/tauri.ortools.json --target ${{ matrix.hedef }}

      # Paket ne taşıyor: imza bütün mü, CP-SAT ve lisans içeride mi, en düşük
      # macOS 11 mi, Belgeler izninin cümlesi Info.plist'te mi. Biri eksikse
      # program yine açılır ama yavaş yoldan ya da sessizce kayıtsız, ve bunu
      # kimse fark etmez.
      - name: Is the .app whole
        run: |
          set -euo pipefail
          kok="src-tauri/target/${{ matrix.hedef }}/release/bundle"
          app="$kok/macos/Mozaik.app"
          test -d "$app" || { echo "Mozaik.app üretilmedi" >&2; ls -R "$kok" | head -50; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          # Sertleştirilmiş çalışma zamanı (DECISIONS 2026-11-16).
          codesign -dv "$app" 2>&1 | grep -q 'flags=.*runtime'
          test -f "$app/Contents/Frameworks/libortools.9.dylib"
          test -f "$app/Contents/Resources/UCUNCU-TARAF.txt"
          [ "$(ls "$app/Contents/Frameworks" | wc -l | tr -d ' ')" = "$(ls src-tauri/ortools/*.dylib | wc -l | tr -d ' ')" ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = "11.0" ]
          /usr/libexec/PlistBuddy -c 'Print :NSDocumentsFolderUsageDescription' "$app/Contents/Info.plist"
          program="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          lipo -archs "$program" | grep -qx "${{ matrix.mimari }}"
          mkdir -p teslim
          # Arşivin içinde tek bir `Mozaik.app` (update_mac.rs, ARSIVDEKI_AD);
          # Finder'ın `._` dosyaları girmesin.
          COPYFILE_DISABLE=1 tar -C "$kok/macos" -czf "teslim/Mozaik-mac-${{ matrix.mimari }}.app.tar.gz" Mozaik.app
          dmg=$(ls "$kok"/dmg/*.dmg | head -1)
          cp "$dmg" "teslim/Mozaik-mac-${{ matrix.mimari }}.dmg"
          ls -l teslim

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-${{ matrix.mimari }}
          path: teslim/*
          if-no-files-found: error

  # --------------------------------------------------------------- 3b · linux
  # Mozaik-linux-x86_64.AppImage (BUILD.md, "Linux"): bütün dağıtımlar için tek
  # dosya, WebKitGTK içinde. Ubuntu 22.04'te derlenir, çünkü program derlendiği
  # sistemin glibc'sini ister ve 22.04'ünki (2.35) Ubuntu 22.04/24.04, Debian 12
  # ve Fedora'da var; OR-Tools'un AlmaLinux 8 arşivi daha azını (2.26) ister.
  #
  # LINUX HİÇBİR ŞEYİ ENGELLEMEZ (Alp, 2026-11-16: Windows ve web önce), Mac'in
  # kuralıyla aynı: bu iş kırmızıysa `sign` ve `publish` yine koşar, o sürümde
  # AppImage olmaz ve Linux kopyaları güncelleme görmez.
  linux:
    strategy:
      fail-fast: false
      matrix:
        mimari: [x86_64]
    runs-on: ubuntu-22.04 # bilerek 22.04 (yukarıda): AppImage'ın glibc tabanı
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable dalı, 2026-11-15
        with:
          toolchain: stable

      # Tauri'nin Linux'ta istedikleri (WebKitGTK 4.1 ve GTK), AppImage
      # paketleyicisinin `file`'ı, paketin içine bakan `readelf` (binutils), ve
      # açılış denemesi için sanal ekran, oturum veri yolu ve bir masaüstünün
      # grafik kütüphaneleri (Mesa: AppImage libEGL/libGL'i sistemden alır).
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev patchelf file binutils desktop-file-utils \
            xvfb dbus libfuse2 libgtk-3-0 libegl1 libgl1 libgles2 libgbm1 >/dev/null

      # Betiksiz ve önbelleksiz, Windows ve Mac işleri gibi.
      - run: npm ci --ignore-scripts
      - run: npm run build

      # OR-Tools'un resmi Linux arşivi, SHA-256'sı betikte sabit; AppImage'a
      # `libortools.so.9`'un yüklediği kütüphanelerin kapanışı girer.
      - name: OR-Tools CP-SAT for the AppImage
        run: scripts/ortools-linux.sh

      - name: cargo test, with the CP-SAT tiny model
        run: |
          MOZAIK_ORTOOLS="$PWD/src-tauri/ortools/libortools.so.9" \
            cargo test --manifest-path src-tauri/Cargo.toml

      # tauri.linux.conf.json kendiliğinden birleşir: hedef yalnız `appimage`.
      - name: Build the AppImage
        # linuxdeploy kendisi bir AppImage: runner'da FUSE'a güvenmeden açılsın.
        # Strip yok: program zaten `strip = true` ile derleniyor, ve linuxdeploy'un
        # eski `strip`'i yeni ELF bölümlerinde (OR-Tools, sistem kütüphaneleri) düşüyor.
        #
        # linuxdeploy, AppDir'deki her ELF'in bağımlılığını sistemin arama yolunda
        # arar ve CP-SAT'ın kütüphanelerinin `RUNPATH $ORIGIN`'ini izlemez: onları
        # kendi klasörlerinde bulsun diye o klasör (tuzak 178). Yalnız AppDir'in
        # klasörü, kaynak `src-tauri/ortools` değil: bu yol derleme sırasında
        # henüz yok, yani cargo ve rustc OR-Tools'un libz'ini görmez.
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
          LD_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/target/release/bundle/appimage/Mozaik.AppDir/usr/lib/Mozaik
        run: npx --yes @tauri-apps/cli@2.12.4 build --verbose --config src-tauri/tauri.ortools.json

      # Paket ne taşıyor (scripts/linux-paket.sh): AppImage imi, program, CP-SAT
      # ve lisansı, CP-SAT'ın paketin içinden küçük modeli çözmesi, glibc tabanı.
      # Sonra yirmi saniye açık kalıyor mu (scripts/linux-acilis.sh).
      - name: Is the AppImage whole, and does it start
        run: |
          set -euo pipefail
          app=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -1)
          test -n "$app" || { echo "AppImage üretilmedi" >&2; ls -R src-tauri/target/release/bundle | head -50; exit 1; }
          scripts/linux-paket.sh "$app"
          mkdir -p teslim
          cp "$app" "teslim/Mozaik-linux-${{ matrix.mimari }}.AppImage"
          ACILIS_CIKTI=acilis scripts/linux-acilis.sh "teslim/Mozaik-linux-${{ matrix.mimari }}.AppImage"
          ls -l teslim

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.mimari }}
          path: teslim/*
          if-no-files-found: error

  # ---------------------------------------------------------------- 4 · sign
  # İMZALAYAN TEK İŞ, ve anahtarı gören tek iş (DECISIONS 2026-11-16). Sır depo
  # düzeyinde değil `release` ortamında; o ortamı yalnız `v*` etiketleri
  # kullanabilir (ayarları BUILD.md'nin "Yayın güvenliği" bölümünde). Bu iş kod
  # derlemez, npm koşturmaz ve yazma token'ı taşımaz: exe, Mac ve Linux artefaktlarını
  # indirir, imzalar, `.minisig`'leri yükler. Yayınlayan iş anahtarı hiç görmez.
  # Mac'i beklemez gibi değil, bekler ama ona takılmaz (`always()`, `publish`'teki
  # kuralın aynısı): gelmeyen bir mimari imzalanmaz.
  sign:
    needs: [exe, mac, linux]
    environment: release
    permissions:
      contents: read
    runs-on: ubuntu-24.04 # geçici (TODO B7.29): Ubuntu 26'da Playwright/WebKit bağımlılıkları doğrulanınca ubuntu-latest'e dön
    if: >-
      always() &&
      needs.exe.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || inputs.publish)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: exe
          path: teslim
      # Hiç Mac artefaktı yoksa bu adım boş döner, düşmez.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mac-*
          merge-multiple: true
          path: teslim
      # Linux da öyle.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          merge-multiple: true
          path: teslim

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            package.json
          sparse-checkout-cone-mode: false
          path: depo

      # İMZA (güvenlik denetimi 2026-11-15). Özet aynı Release'ten geliyor, yani
      # dosyanın eksiksiz indiğini söylüyor ama bizim olduğunu söylemiyor; imza
      # söylüyor. Anahtarın gizli yarısı `release` ortamının sırrı
      # MOZAIK_IMZA_ANAHTARI (2026-11-16'ya kadar depo sırrıydı), açık yarısı update.rs'in IMZA_ANAHTARI'sı. Sır yoksa yayın burada durur:
      # imzasız bir sürümü yeni kopyalar kurmaz, eskileri ise hiç doğrulamaz.
      - name: Sign the programs
        env:
          ANAHTAR: ${{ secrets.MOZAIK_IMZA_ANAHTARI }}
        run: |
          test -n "$ANAHTAR" || { echo "MOZAIK_IMZA_ANAHTARI sırrı tanımlı değil" >&2; exit 1; }
          sudo apt-get install -y -qq minisign >/dev/null
          gizli=$(mktemp -d); chmod 700 "$gizli"
          # Adım hangi satırda düşerse düşsün anahtar dosyası diskte kalmaz.
          trap 'rm -rf "$gizli"' EXIT
          umask 077; printf '%s\n' "$ANAHTAR" > "$gizli/anahtar"
          # Güvenilen yorum sürümü ve dosyayı bağlıyor (update.rs, `imza_yorumu`):
          # eski imzalı bir sürüm yenisi diye, ya da bir dosya ötekinin yerine
          # sunulamaz.
          surum=$(node -p "require('./depo/package.json').version")
          minisign -S -s "$gizli/anahtar" -m teslim/Mozaik.exe -x imza-exe.minisig \
            -t "mozaik $surum Mozaik.exe"
          minisign -S -s "$gizli/anahtar" -m teslim/Mozaik-Kurulum.exe -x imza-kurulum.minisig \
            -t "mozaik $surum Mozaik-Kurulum.exe"
          # Mac'in güncelleme arşivleri, aynı anahtar ve aynı biçimde yorum
          # (update_mac.rs), yalnız iki dosyası da gelen mimari (`publish` aynı
          # kuralla seçer). .dmg'ler elle kurulur, program onları indirmez.
          for m in arm64 x86_64; do
            if [ -s "teslim/Mozaik-mac-$m.app.tar.gz" ] && [ -s "teslim/Mozaik-mac-$m.dmg" ]; then
              minisign -S -s "$gizli/anahtar" -m "teslim/Mozaik-mac-$m.app.tar.gz" -x "imza-mac-$m.minisig" \
                -t "mozaik $surum Mozaik-mac-$m.app.tar.gz"
            fi
          done
          # Linux'un AppImage'ı, aynı biçimde yorum (update_linux.rs), yalnız geldiyse.
          if [ -s teslim/Mozaik-linux-x86_64.AppImage ]; then
            minisign -S -s "$gizli/anahtar" -m teslim/Mozaik-linux-x86_64.AppImage -x imza-linux.minisig \
              -t "mozaik $surum Mozaik-linux-x86_64.AppImage"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: imza
          path: imza-*.minisig
          if-no-files-found: error

  # ------------------------------------------------------------- 5 · publish
  publish:
    needs: [package, exe, mac, linux, sign]
    permissions:
      contents: write
    runs-on: ubuntu-24.04 # geçici (TODO B7.29): Ubuntu 26'da Playwright/WebKit bağımlılıkları doğrulanınca ubuntu-latest'e dön
    # `always()`: mac ya da linux işi düşse de bu iş koşar; yalnız Windows ve paket şart.
    if: >-
      always() &&
      needs.package.result == 'success' &&
      needs.exe.result == 'success' &&
      needs.sign.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || inputs.publish)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: indirilen

      - name: Did the assets arrive
        run: |
          mv indirilen/imza/imza-*.minisig .
          mkdir -p teslim && find indirilen -type f -exec mv {} teslim/ \;
          ls -l teslim
          for f in Mozaik.html Mozaik-Windows-kurulum.zip Mozaik.exe Mozaik-Kurulum.exe; do
            test -s "teslim/$f" || { echo "$f eksik ya da boş" >&2; exit 1; }
          done
          for f in imza-exe.minisig imza-kurulum.minisig; do
            test -s "$f" || { echo "$f eksik ya da boş" >&2; exit 1; }
          done
          # Mac: bir mimari ancak iki dosyası da geldiyse ve `sign` onu
          # imzaladıysa yayına girer. Gelmeyen
          # durdurmaz, görünür olur: uyarı ve iş özeti.
          var=""
          for m in arm64 x86_64; do
            if [ -s "teslim/Mozaik-mac-$m.app.tar.gz" ] && [ -s "teslim/Mozaik-mac-$m.dmg" ] \
               && [ -s "imza-mac-$m.minisig" ]; then
              var="$var $m"
            else
              rm -f "teslim/Mozaik-mac-$m.app.tar.gz" "teslim/Mozaik-mac-$m.dmg" "imza-mac-$m.minisig"
              echo "::warning title=Mac paketi bu sürümde yok::$m derlenmedi; Windows ve surum.json yine yayınlanıyor, bu mimarideki Mac kopyaları güncelleme görmez."
              echo "**Mac paketi bu sürümde yok: $m.** Windows ve web yayınlandı." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "MAC_VAR=${var# }" >> "$GITHUB_ENV"
          echo "Mac: ${var:- yok}"
          # Linux: aynı kural, tek dosya.
          if [ -s teslim/Mozaik-linux-x86_64.AppImage ] && [ -s imza-linux.minisig ]; then
            echo "LINUX_VAR=1" >> "$GITHUB_ENV"
            echo "Linux: var"
          else
            rm -f teslim/Mozaik-linux-x86_64.AppImage imza-linux.minisig
            echo "::warning title=Linux paketi bu sürümde yok::AppImage derlenmedi; Windows ve surum.json yine yayınlanıyor, Linux kopyaları güncelleme görmez."
            echo "**Linux paketi bu sürümde yok.** Windows ve web yayınlandı." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/surum-notu.md
            package.json
            CHANGELOG.md
            src/platform/changelog.ts
            scripts/surum-notu.mjs
          sparse-checkout-cone-mode: false
          path: depo

      # Exe'nin karşılaştıracağı numara, ve KİMİN söylediği önemli.
      #
      # Numara etiketten değil `package.json`'dan alınır: sayfaya basılan
      # `__SURUM__` odur (scripts/surum.mjs), yani exe kendini o numarayla
      # tanıtır. Etiket ondan başkaysa iş burada durur — yayınlanmış ama
      # kendini asla güncel sayamayan bir exe, hiç yayınlamamaktan kötüdür.
      - name: Build surum.json
        env:
          ETIKET: ${{ inputs.tag || github.ref_name }}
        run: |
          set -o pipefail
          surum=$(node -p "require('./depo/package.json').version")
          if [ "v$surum" != "$ETIKET" ]; then
            echo "package.json $surum diyor, etiket $ETIKET — ikisi aynı olmalı" >&2
            echo "  npm run yayinla -- $surum   (etiketi de o atar)" >&2
            exit 1
          fi
          boyut=$(stat -c%s teslim/Mozaik.exe)
          # The digest update.rs holds the download against (2026-10-24): the
          # same file, the same sha256sum line SHA256SUMS.txt carries.
          ozet=$(sha256sum teslim/Mozaik.exe | cut -d' ' -f1)
          kurulum_boyut=$(stat -c%s teslim/Mozaik-Kurulum.exe)
          kurulum_ozet=$(sha256sum teslim/Mozaik-Kurulum.exe | cut -d' ' -f1)
          # ADRES DEPONUN BUGÜNKÜ ADINDAN GELMEZ, ve bu bilerek.
          #
          # `update.rs`'in kabul ettiği adres önekleri, dağıtılmış her exe'nin
          # İÇİNE derlenmiş. Depo `ders-programi` -> `Mozaik` olunca
          # yayınlanmış v2.0.2 yeni adı tanımadı: "Güncellemeleri denetle"
          # `Beklenmeyen adres: ...` dedi ve o kopya bir daha güncellenemez
          # hâle geldi. O ikiliyi artık değiştiremeyiz; değiştirebileceğimiz
          # tek şey manifestteki adres.
          #
          # GitHub eski adı yeni ada 301'liyor (ölçüldü 2026-08-31), yani ESKİ
          # adla yazılmış bir adres HER İKİ tarafı da memnun eder: eski kopya
          # öneki tanır ve yönlendirmeyi izler, buradan derlenen kopya da onu
          # tanır (RELEASE_KOKLERI iki adı da taşır, ve src/surum.test.ts bu
          # satırın o listeyle uyuştuğunu her koşuda ölçer).
          #
          # Bunu yeni ada çevirmenin şartı: babanın makinesindeki exe >= 2.0.4.
          adres="https://github.com/AlparslanSemiz/ders-programi/releases/latest/download/Mozaik.exe"
          # Kurulum aynı önekte. Eski kopyalar bu iki alanı tanımaz ve
          # yukarıdaki tek dosyayı indirmeye devam eder (köprü, update.rs).
          kurulum="https://github.com/AlparslanSemiz/ders-programi/releases/latest/download/Mozaik-Kurulum.exe"
          # Mac arşivleri de aynı önekte; her Mac yalnız kendi mimarisininkini
          # alır (update.rs, `mac_karari`). Eski Windows kopyaları bu alanları
          # tanımaz ve atlar (kontrat.test.ts, OPTIONAL). Gelmeyen mimarinin
          # alanları hiç yazılmaz (undefined), Mac kopyası o zaman güncelleme
          # önermez (`mac_karari`).
          mac_kok="https://github.com/AlparslanSemiz/ders-programi/releases/latest/download"
          for m in $MAC_VAR; do
            f="teslim/Mozaik-mac-$m.app.tar.gz"
            export "MAC_${m}_ADRES=$mac_kok/Mozaik-mac-$m.app.tar.gz"
            export "MAC_${m}_BOYUT=$(stat -c%s "$f")"
            export "MAC_${m}_OZET=$(sha256sum "$f" | cut -d' ' -f1)"
          done
          # Linux'un AppImage'ı da aynı önekte; gelmediyse alanları yazılmaz
          # (undefined) ve AppImage kopyası güncelleme önermez (`linux_karari`).
          if [ -n "${LINUX_VAR:-}" ]; then
            f="teslim/Mozaik-linux-x86_64.AppImage"
            export "LINUX_ADRES=$mac_kok/Mozaik-linux-x86_64.AppImage"
            export "LINUX_BOYUT=$(stat -c%s "$f")"
            export "LINUX_OZET=$(sha256sum "$f" | cut -d' ' -f1)"
          fi
          node -e "
            const fs = require('fs');
            const oku = (f) => (fs.existsSync(f) ? fs.readFileSync(f, 'utf8') : undefined);
            const sayi = (v) => (v ? Number(v) : undefined);
            fs.writeFileSync('teslim/surum.json', JSON.stringify({
              version: process.argv[1],
              date: new Date().toISOString().slice(0, 10),
              exe: process.argv[2],
              boyut: Number(process.argv[3]),
              sha256: process.argv[4],
              kurulum: process.argv[5],
              kurulum_boyut: Number(process.argv[6]),
              kurulum_sha256: process.argv[7],
              imza: fs.readFileSync('imza-exe.minisig', 'utf8'),
              kurulum_imza: fs.readFileSync('imza-kurulum.minisig', 'utf8'),
              mac_arm64: process.env.MAC_arm64_ADRES,
              mac_arm64_boyut: sayi(process.env.MAC_arm64_BOYUT),
              mac_arm64_sha256: process.env.MAC_arm64_OZET,
              mac_arm64_imza: oku('imza-mac-arm64.minisig'),
              mac_x86_64: process.env.MAC_x86_64_ADRES,
              mac_x86_64_boyut: sayi(process.env.MAC_x86_64_BOYUT),
              mac_x86_64_sha256: process.env.MAC_x86_64_OZET,
              mac_x86_64_imza: oku('imza-mac-x86_64.minisig'),
              linux_appimage: process.env.LINUX_ADRES,
              linux_appimage_boyut: sayi(process.env.LINUX_BOYUT),
              linux_appimage_sha256: process.env.LINUX_OZET,
              linux_appimage_imza: oku('imza-linux.minisig'),
            }, null, 2) + '\n');
          " "$surum" "$adres" "$boyut" "$ozet" "$kurulum" "$kurulum_boyut" "$kurulum_ozet"
          cat teslim/surum.json

      # WHAT WAS DOWNLOADED, in a form somebody can check. The .exe is unsigned
      # and always will be — a certificate costs money and the answer to that
      # was no — so "is this the file they published" has no answer from
      # Windows. It has one from a hash: `Get-FileHash Mozaik.exe` beside the
      # line in this file. It does not stop SmartScreen and is not meant to;
      # it is the one thing that can be offered in place of a signature.
      - name: Build SHA256SUMS.txt
        run: |
          set -o pipefail
          cd teslim
          mac=()
          for m in $MAC_VAR; do mac+=("Mozaik-mac-$m.app.tar.gz" "Mozaik-mac-$m.dmg"); done
          if [ -n "${LINUX_VAR:-}" ]; then mac+=("Mozaik-linux-x86_64.AppImage"); fi
          sha256sum Mozaik.html Mozaik-Windows-kurulum.zip Mozaik.exe Mozaik-Kurulum.exe \
            "${mac[@]}" surum.json > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # WHAT IS NEW, on the Release page itself: the Turkish lines Ayarlar →
      # Hakkında shows, the version's CHANGELOG.md section, then the install
      # text every release shares. The page used to carry the install text
      # alone. A version with nothing to say stops here (scripts/surum-notu.mjs).
      - name: Build the release notes
        env:
          ETIKET: ${{ inputs.tag || github.ref_name }}
        run: |
          set -o pipefail
          node depo/scripts/surum-notu.mjs "${ETIKET#v}" depo > notlar.md
          cat notlar.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          # Elle koşuda etiket girdiden gelir; itilmiş bir etikette ref'ten.
          ETIKET: ${{ inputs.tag || github.ref_name }}
        run: |
          set -o pipefail
          if [ -z "$ETIKET" ]; then echo "etiket adı boş" >&2; exit 1; fi
          # `gh` runner'da zaten kurulu — sürüm yayınlamak gibi bir işe
          # üçüncü parti bir action sokmak, en az istenecek yerde yabancı kod
          # çalıştırmak olurdu.
          # Notu ayrı dosyadan: bir YAML blok skalerinin içine heredoc koymak
          # girintiyi bozuyor. Dosyayı bir önceki adım kuruyor.
          # Mac ve Linux dosyaları yalnız geldiyse (`MAC_VAR`, `LINUX_VAR`, ilk adım).
          mac=()
          for f in teslim/Mozaik-mac-arm64.app.tar.gz teslim/Mozaik-mac-arm64.dmg \
                   teslim/Mozaik-mac-x86_64.app.tar.gz teslim/Mozaik-mac-x86_64.dmg \
                   teslim/Mozaik-linux-x86_64.AppImage; do
