# Windows'ta ana E2E: babanın ortamına (Windows, Chromium ya da Edge, yani
# WebView2'nin motoru) en yakın test. Bütün ana süit, uzun test dahil.
#
# main'e gelen her push'ta koşar (2026-10-09, kullanıcının kararı), ama siteyi
# kilitlemez: yayının kapısı yalnız ci.yml, bu dosya onun `needs`'inde yok. Bir
# Windows kırmızısı sitenin değil sürümün önünü keser: `npm run yayinla` etiketi
# yalnız ci.yml'in ve bu dosyanın o commit'teki koşusu ikisi de yeşilse atar,
# çünkü etiket babanın exe'sine gider (BUILD.md).
#
# haftalik.yml bunu çağırır (`uses: ./`), tanım tek yerde kalsın; elle de
# tetiklenir ve o zaman tarayıcı seçilir. Aynı dalın eski koşusu yenisi gelince
# iptal edilir; grup çağıranın adını taşıyor, haftalık bir koşu push'unkini
# iptal etmesin.
#
# Öneri aramasının iki testi ci.yml'deki gibi ayrı ve sırayla (B7.23): ilk
# haftalık koşuda (2026-10-09) süit içinde ikisi de kararsızdı.
name: windows

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      kanal:
        type: string
        default: chromium
  workflow_dispatch:
    inputs:
      kanal:
        description: 'Browser: Playwright Chromium or the installed Edge'
        type: choice
        options: [chromium, msedge]
        default: chromium

permissions:
  contents: read

# Öneri aramasının testleri `@arama` etiketiyle seçiliyor, ci.yml'deki gibi;
# neden ayrı koştukları orada yazılı.

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      PLAYWRIGHT_KANAL: ${{ inputs.kanal == 'msedge' && 'msedge' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx vite build
      # Rapor iki adımın blob'larından birleşiyor.
      - name: E2E (${{ inputs.kanal || 'chromium' }}), öneri araması hariç
        id: ana
        shell: bash
        run: >-
          npx playwright test --grep-invert @arama
          --reporter=blob,list --trace=retain-on-failure
        env:
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/ana.zip
      # Her E2E adımının kendi tekrarı: sıradaki adım test-results/'u, yani
      # kararsiz.mjs'in okuduğu .last-run.json'u siler. İzler blob'larda kalıyor.
      - name: Kararsız mı, ana süit (yalnız özete yazar)
        if: ${{ failure() && steps.ana.outcome == 'failure' }}
        continue-on-error: true
        run: node scripts/kararsiz.mjs
      - name: E2E, öneri aramasının testleri, sırayla
        id: arama
        if: ${{ !cancelled() }}
        shell: bash
        run: >-
          npx playwright test --grep @arama --workers=1
          --reporter=blob,list --trace=retain-on-failure
        env:
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/arama.zip
      - name: Kararsız mı, öneri araması (yalnız özete yazar)
        if: ${{ failure() && steps.arama.outcome == 'failure' }}
        continue-on-error: true
        run: node scripts/kararsiz.mjs
      - name: Rapor
        if: ${{ !cancelled() }}
        run: npx playwright merge-reports --reporter=html ./blob-report
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-playwright-raporu
          path: playwright-report/
          retention-days: 7
