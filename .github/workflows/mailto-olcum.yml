# GEÇİCİ ÖLÇÜM (ogretmene-eposta, 2026-10-24): bir mailto: adresinin Windows'ta
# ShellExecute'tan ve tarayıcıdan e-posta programına ne kadarının ulaştığı, ve
# kayıtlı bir program yokken ne olduğu. Runner atılan bir makine. Dal birleşmeden
# önce kalkar.
#
# 40104303724: kayıtlı program yokken AssocQueryStringW 0x80070483, ShellExecuteW 42
# ve OpenWith açılıyor; HKCU'ya yazılan mailto kaydı UserChoice olmadan sayılmıyor.
# 40105704173: ShellExecuteW 32 000'i kabuğa veriyor, 40 000'de 2; Chromium 4000'i
# veriyor; Edge hiçbirini (dış program sorusu).
# 40105976835: mailto ShellExecuteW'de 32 760'a kadar kabuğa ulaşıyor, 32 767'de 2;
# Chromium 32 700'e kadar, 32 760'tan sonra değil; Edge politikayla da hiçbirini.
# OpenWith adresi COM ile alıyor (-Embedding), uzunluğu oradan okunmuyor. Burada:
# ShellExecuteW'nin ilettiği metin bozulmadan mı, kendi şemamızla.
name: mailto-olcum

on:
  push:
    branches: [ogretmene-eposta]
    paths: ['.github/workflows/mailto-olcum.yml']

permissions:
  contents: read

jobs:
  olc:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium

      - name: ShellExecuteW, ulaşan metin bozulmadan mı (kendi şemamızla)
        shell: pwsh
        timeout-minutes: 8
        run: |
          $d = "$env:RUNNER_TEMP\olc"; New-Item -ItemType Directory -Force $d | Out-Null
          # The handler writes the url it got, exactly, and nothing else.
          Set-Content "$d\yakala.mjs" @'
          import { writeFileSync } from 'node:fs';
          writeFileSync(process.env.YAKALA_DOSYA, process.argv[2] ?? '');
          '@
          $node = (Get-Command node).Source
          $k = 'HKCU:\Software\Classes\mozaikolc'
          New-Item -Force $k | Out-Null
          Set-ItemProperty $k '(default)' 'URL:Mozaik olcum'
          Set-ItemProperty $k 'URL Protocol' ''
          New-Item -Force "$k\shell\open\command" | Out-Null
          Set-ItemProperty "$k\shell\open\command" '(default)' "`"$node`" `"$d\yakala.mjs`" `"%1`""
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class K { [DllImport("shell32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr ShellExecuteW(IntPtr h, string op, string f, string a, string d, int s); }'
          $env:YAKALA_DOSYA = "$d\se.txt"
          foreach ($n in 1000, 2000, 2083, 4000, 8000, 16000, 32000, 32700) {
            Remove-Item $env:YAKALA_DOSYA -ErrorAction SilentlyContinue
            $parca = 'Pazartesi%0D%0A%20%201.%20ders%2008%3A30%20%20510A%20Mat%20%C4%9F%C3%BC%C5%9F%C4%B1%0D%0A'
            $u = 'mozaikolc:a@ornek.com?subject=S&body='; while ($u.Length -lt $n) { $u += $parca }; $u = $u.Substring(0, $n)
            $r = [K]::ShellExecuteW([IntPtr]::Zero, 'open', $u, $null, $null, 1)
            $gelen = $null
            for ($i = 0; $i -lt 20 -and $null -eq $gelen; $i++) { Start-Sleep -Milliseconds 250; if (Test-Path $env:YAKALA_DOSYA) { $gelen = [IO.File]::ReadAllText($env:YAKALA_DOSYA) } }
            if ($null -ne $gelen) { Write-Host "SE2 gönderilen $n dönüş $r -> gelen $($gelen.Length) aynı mı $($gelen -ceq $u)" }
            else { Write-Host "SE2 gönderilen $n dönüş $r -> GELMEDİ" }
          }
