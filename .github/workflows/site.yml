# Publish dist-site/ to GitHub Pages. Called by ci.yml, never on its own.
#
# 2026-10-08: this used to run on every push to main, with no test in front of
# it. It is now a reusable workflow that ci.yml calls (`uses: ./`) after its
# four test jobs are green, and only for a push to main. GitHub runs the called
# file from the SAME commit as the caller, so what is published is the commit
# that passed. A red run leaves the site as it was. There is no push and no
# manual trigger here on purpose: either would publish without the tests. To
# republish, run ci.yml by hand on main.
#
# This is the SECOND delivery route, not the first. The one that matters is
# still dist/index.html — the file my father double-clicks — and nothing here
# builds it or touches it. What gets published is the folder produced by
# `npm run build:site`: one HTML file plus a manifest, a service worker and
# three icons.
#
# `npm run build:site` starts with `tsc --noEmit`, so a type error fails the
# deploy as well.
#
# Pages has to be set to Settings -> Pages -> Source: "GitHub Actions", and the
# `github-pages` environment allows `main` only (both checked 2026-10-08).

name: site

on:
  workflow_call:

# The caller grants these to the job that calls this file; a called workflow
# can keep or lower them, never raise them. One deploy at a time comes from
# ci.yml's own concurrency group.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04 # geçici (TODO B7.29): Ubuntu 26'da Playwright/WebKit bağımlılıkları doğrulanınca ubuntu-latest'e dön
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build:site

      # The claim this project makes about itself, checked on the machine that
      # publishes rather than only on the one that develops: the page carries
      # its own code, so a browser that has it does not need us again.
      - name: Is dist-site still one file
        run: |
          set -o pipefail
          ls -l dist-site
          if grep -q '<script[^>]*src=' dist-site/index.html; then
            echo "dist-site/index.html ikinci bir betik istiyor" >&2
            exit 1
          fi

      # THE NEW ADDRESS (DECISIONS 2026-11-16). One switch, `yeniAdresAcik` in
      # src/leaf/app/adres.json, and it is off until Alp has set the DNS record
      # and the custom domain in Settings -> Pages (BUILD.md, "Alan adına
      # geçiş"). On, the artifact carries a CNAME with the new host name. A
      # Pages site deployed by Actions takes its custom domain from Settings,
      # not from this file, so the file is a written record that travels with
      # the deploy rather than the thing that moves the site; off, there is no
      # CNAME at all, so flipping it back cannot leave one behind.
      - name: CNAME for the new address
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync("src/leaf/app/adres.json", "utf8"));
            if (a.yeniAdresAcik === true) {
              const host = new URL(a.yeni).hostname;
              fs.writeFileSync("dist-site/CNAME", host + "\n");
              console.log("CNAME: " + host);
            } else {
              fs.rmSync("dist-site/CNAME", { force: true });
              console.log("CNAME yok: yeniAdresAcik kapali");
            }
          '

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-site

  deploy:
    needs: build
    runs-on: ubuntu-24.04 # geçici (TODO B7.29): Ubuntu 26'da Playwright/WebKit bağımlılıkları doğrulanınca ubuntu-latest'e dön
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
