# Bağımlılık güncellemesi: otomatik BİLDİRİM, otomatik güncelleme değil.
#
# Uzun ömürlü bir proje ve tek bakımcısı var, yani "bir gün oturup bakarım"
# demek "bakmam" demek. Dependabot haftada bir bakar, bir PR açar, `ci.yml`
# PR'ın dalındaki her push'ta süiti koşturur ve karar insana kalır. Renovate yerine bu seçildi: GitHub'ın
# kendi içinde, kurulacak bir uygulama yok, ve istenen şey zaten bir bildirim.
#
# Gruplama bilerek geniş: yirmiyi aşan geliştirme bağımlılığı için haftada bir PR
# her biri, bakılmayan bir PR yığını demektir. Küçük sürümler tek PR'da gelir, ana
# sürümler ayrı, çünkü ana sürüm okunarak alınır.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      kucuk-surumler:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: 'Bağımlılık'
    labels: ['bağımlılık']

  # Exe'nin Rust bağımlılıkları (tauri, reqwest, sha2...). Yayınlanan programa
  # giren kod bu, yani npm'deki geliştirme araçlarından daha önemli; aylık, tek
  # PR'da gruplu, ana sürümler ayrı (güvenlik denetimi 2026-11-15, B1).
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      kucuk-surumler:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: 'Bağımlılık'
    labels: ['bağımlılık']

  # İş akışlarının kendi eylemleri de bağımlılık: `actions/checkout@v4` bir gün
  # eskir ve bunu kimse fark etmez. Üçüncü taraf eylemler tam commit SHA'sıyla
  # sabit (yanında sürüm yorumu); Dependabot SHA'yı ve yorumu birlikte günceller.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'İş akışı'
    labels: ['bağımlılık']
