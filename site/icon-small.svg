<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Mozaik">
  <title>Mozaik</title>
  <!-- THE SAME MARK, FOR SMALL SIZES. Not a second logo: the same idea —
       coloured lessons sitting in a week — drawn with what survives at 16 px.
       Three columns instead of six, no ghost columns behind them, and bars
       nearly twice as wide.

       Why it exists: the detailed mark was rendered at 16, 32, 48 and 256 and
       LOOKED AT. At 48 and up it is clean; at 16 the six columns merge into a
       blue smear and the tab cannot be picked out of a row of tabs. Real icon
       sets do exactly this — a simplified variant below a size threshold.

       Used by: the favicon in index.html (a tab icon is ALWAYS small) and the
       16/32 px entries of kurulum/icon.ico. Everything drawn large — the
       192/512 PWA icons, the top bar — uses site/icon.svg. -->
  <rect width="512" height="512" rx="112" fill="#2e3ba8"/>
  <!-- Three lessons, three days. The gaps are as wide as they can be without
       the bars getting thin: at 16 px a gap under 2 device pixels closes. -->
  <rect x="96"  y="112" width="96" height="192" rx="32" fill="#65b6ec"/>
  <rect x="208" y="208" width="96" height="192" rx="32" fill="#9ff292"/>
  <rect x="320" y="128" width="96" height="160" rx="32" fill="#f3de9b"/>
</svg>
