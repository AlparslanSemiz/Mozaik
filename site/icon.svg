<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Mozaik">
  <title>Mozaik</title>
  <!-- Drawn by hand, not fetched: principle 3 means no icon CDN either.
       CHOSEN ON 2026-08-26 out of three, looked at side by side at 16, 32, 64
       and 192 px on both grounds. The two it beat are kept beside it in
       site/logo-adaylari/ — a clock ring, which was the most legible at 16 px
       but read as a clock APP, and a "DP" monogram, which was the sharpest and
       said the least.

       The one it replaced was the same idea with grid lines, a header strip,
       an outline and seven blocks in it; at 16 px all of that turned to mud.
       What is left is the one thing the tool does: coloured blocks sitting in
       a week. Six columns because the school week here is six days.

       Colours are the app's own accent plus three palette entries, so the mark
       cannot drift away from what the program looks like. Full bleed, and
       everything that matters sits inside the middle 80 % the maskable variant
       is cropped to (measured: content spans 104-452 of 512, the safe box is
       51-461). -->
  <rect width="512" height="512" rx="112" fill="#2e3ba8"/>
  <g>
    <!-- Monday..Saturday, four rows of hours. Only the filled cells are drawn:
         the empty ones are the background, which is what an empty hour IS. -->
    <g fill="#ffffff" opacity=".16">
      <rect x="104" y="120" width="48" height="272" rx="16"/>
      <rect x="164" y="120" width="48" height="272" rx="16"/>
      <rect x="224" y="120" width="48" height="272" rx="16"/>
      <rect x="284" y="120" width="48" height="272" rx="16"/>
      <rect x="344" y="120" width="48" height="272" rx="16"/>
      <rect x="404" y="120" width="48" height="272" rx="16"/>
    </g>
    <rect x="104" y="132" width="48" height="112" rx="16" fill="#65b6ec"/>
    <rect x="164" y="200" width="48" height="60"  rx="16" fill="#9ff292"/>
    <rect x="224" y="132" width="48" height="60"  rx="16" fill="#f3de9b"/>
    <rect x="284" y="216" width="48" height="112" rx="16" fill="#65b6ec"/>
    <rect x="344" y="140" width="48" height="60"  rx="16" fill="#c3a2cd"/>
    <rect x="404" y="268" width="48" height="112" rx="16" fill="#9ff292"/>
  </g>
</svg>
